name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # Excludes the `live` build tag on purpose — those tests dial the
      # real production fleet, which has no uptime guarantee, and must
      # never block an unrelated PR. Run explicitly:
      #   go test -tags=live ./... -run TestLive -v
      # cabi's tests include building libmacula and driving it from C, which
      # must not quietly skip here.
      - run: go test ./...
        env:
          MACULA_ABI_TEST: required
      # cabi hands values between goroutines and a binding's threads.
      - run: go test -race ./cabi
        env:
          MACULA_ABI_TEST: required
      # The decoding packages read peer bytes, so their tests also run with a
      # 32-bit int.
      - run: GOARCH=386 CGO_ENABLED=0 go test ./cbor ./frame ./manifest
      # A binary built with GOFIPS140=v1.0.0 has no ML-DSA. These tests check
      # that its key operations, verifiers and dials say so. go test -run passes
      # when no test matches, so each test must also report a PASS line. shell:
      # bash runs the step with pipefail, so go test's own exit status counts
      # through tee.
      - shell: bash
        run: |
          GOFIPS140=v1.0.0 go test ./identity ./handshake ./transport ./frame ./record -run SaysWhetherTheBinaryHasMLDSA -count=1 -v | tee gofips140.log
          for name in TestAKeyOperationSaysWhetherTheBinaryHasMLDSA TestAVerifierSaysWhetherTheBinaryHasMLDSA TestReadStatusSaysWhetherTheBinaryHasMLDSA TestDialTargetSaysWhetherTheBinaryHasMLDSA TestASignedFrameVerifierSaysWhetherTheBinaryHasMLDSA TestARecordVerifierSaysWhetherTheBinaryHasMLDSA; do
            grep -q -- "--- PASS: $name " gofips140.log || { echo "no PASS line for $name"; exit 1; }
          done

  libmacula:
    uses: ./.github/workflows/libmacula.yml
