name: libmacula

# Builds libmacula (cabi as a C shared library) for every release platform,
# checks each against the floor cabi/CONTRACT.md promises, proves it loads
# where the runner can run it, and uploads each as an artifact. CI calls this
# on every push, so a platform that stops building fails before a tag does;
# release.yml calls it for a tag and publishes what it built.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The build runs in the manylinux_2_28 image, so the library needs no
      # glibc newer than 2.28; the toolchain setup-go installed is mounted in.
      - name: Build in manylinux_2_28
        run: |
          docker run --rm -v "$PWD":/w -v "$(go env GOROOT)":/opt/go:ro -w /w \
            -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/gopath -e GOFLAGS=-buildvcs=false -e GOTOOLCHAIN=local \
            ${{ matrix.image }} \
            bash -c 'export PATH=/opt/go/bin:$PATH GOROOT=/opt/go; scripts/libmacula/build.sh ${{ matrix.platform }} out'
      - name: Load it here
        run: |
          sudo chown -R "$(id -u)" out
          cc -I cabi -o load_check scripts/libmacula/load_check.c "$PWD/out/libmacula-${{ matrix.platform }}.so" -Wl,-rpath,"$PWD/out"
          ./load_check
      - uses: actions/upload-artifact@v4
        with:
          name: libmacula-${{ matrix.platform }}
          path: out/libmacula-${{ matrix.platform }}.so
          if-no-files-found: error

  macos:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 is cross-built on the arm64 runner; it loads under Rosetta.
          - platform: macos-arm64
          - platform: macos-x64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for macOS 13.0
        run: scripts/libmacula/build.sh ${{ matrix.platform }} out
      - name: Load it here
        run: |
          arch=arm64
          if [ "${{ matrix.platform }}" = macos-x64 ]; then arch=x86_64; fi
          clang -arch "$arch" -mmacosx-version-min=13.0 -I cabi -o load_check scripts/libmacula/load_check.c \
            "$PWD/out/libmacula-${{ matrix.platform }}.dylib" -Wl,-rpath,"$PWD/out"
          arch -"$arch" ./load_check
      - uses: actions/upload-artifact@v4
        with:
          name: libmacula-${{ matrix.platform }}
          path: out/libmacula-${{ matrix.platform }}.dylib
          if-no-files-found: error

  windows:
    name: windows-x64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/libmacula/build.sh windows-x64 out
      - name: Load it here
        run: |
          gcc -I cabi -o load_check.exe scripts/libmacula/load_check.c out/macula-windows-x64.dll
          cp out/macula-windows-x64.dll .
          ./load_check.exe
      - uses: actions/upload-artifact@v4
        with:
          name: libmacula-windows-x64
          path: out/macula-windows-x64.dll
          if-no-files-found: error
