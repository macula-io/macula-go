name: Sealed interop

# macula (Erlang) and macula-go seal calls and streams to each other, both
# ways, in both profiles (scripts/interop/sealed.sh, README "sealed"). This
# runs it on every PR and master push, and on a v* tag through release.yml,
# which attaches the log to the release: a cross-SDK sealing claim rests on a
# recorded CI run at the released sha, not on a run by hand (#10).
#
# The Erlang side is macula from hex at MACULA_VERSION, compiled as a rebar3
# dependency in macula's pinned CI image (the image sealed.sh runs it in), so
# the build and the run use one toolchain. MACULA_OFF_REFUSED=1 also requires
# macula's refusal of `confidential => off' by direct dial (13.0.1 on).
#
# workflow_dispatch takes another macula version: a release without sealing
# (any 12.x) must turn this red, which is how the job was shown able to fail.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:
    inputs:
      macula_version:
        description: macula release from hex to interoperate with
        required: false
        default: ""

permissions:
  contents: read

env:
  # The version scripts/interop/README.md records as last run; move both together.
  MACULA_VERSION: ${{ inputs.macula_version || '13.0.1' }}
  MACULA_CI_IMAGE: ghcr.io/macula-io/macula-ci-otp@sha256:aff1d39bc4aa29d13044b90b38e9b7f4b757d50818cc11c5bb7e84cdbf82ac70

jobs:
  sealed:
    name: sealed interop (macula ${{ inputs.macula_version || '13.0.1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build macula ${{ env.MACULA_VERSION }} from hex in the CI image
        run: |
          mkdir -p "$RUNNER_TEMP/macula-build"
          printf '{deps, [{macula, "%s"}]}.\n' "$MACULA_VERSION" > "$RUNNER_TEMP/macula-build/rebar.config"
          podman run --rm -v "$RUNNER_TEMP/macula-build:/b" -w /b "$MACULA_CI_IMAGE" rebar3 compile
          test -d "$RUNNER_TEMP/macula-build/_build/default/lib/macula/ebin"
      - name: Both ways, pq_hybrid and pq_pure
        shell: bash
        env:
          MACULA_OFF_REFUSED: "1"
        run: |
          export MACULA_BUILD="$RUNNER_TEMP/macula-build"
          {
            echo "macula-go $GITHUB_SHA, macula $MACULA_VERSION from hex, $MACULA_CI_IMAGE"
            scripts/interop/sealed.sh pq_hybrid
            scripts/interop/sealed.sh pq_pure
          } 2>&1 | tee sealed-interop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-interop-log
          path: sealed-interop.log
